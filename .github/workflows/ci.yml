name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 24 = Version aus dem Dockerfile, 22 = aktuelles LTS
        node-version: ['22', '24']

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node.js einrichten
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Syntax-Check
        run: node --check read_fritzbox_dsl.js

      - name: Tests
        run: npm test

  telegram-live:
    name: Telegram-Anbindung (live)
    runs-on: ubuntu-latest
    # Eigener Job statt in der Matrix: sonst eine Nachricht je Node-Version.
    # Laeuft nicht bei Fork-PRs - dort sind keine Secrets verfuegbar.
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Versand gegen die echte Telegram-API prüfen
        env:
          TELEGRAM_LIVE_TEST: '1'
          # Repository-Variablen statt Secrets: Dependabot-PRs sehen keine
          # Actions-Secrets, wohl aber vars - so muss der Wert nur an einer
          # Stelle gepflegt werden. Preis: vars werden in Logs nicht maskiert.
          TELEGRAM_BOT_TOKEN: ${{ vars.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
        run: npm test
